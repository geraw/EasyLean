# Builds the backend's Docker image and checks it with a real proof. The
# image is deployed to Google Cloud Run with ops/deploy-backend.sh.
name: Backend

on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t easylean-backend backend

      - name: Start it
        run: |
          docker run -d --name backend -p 8080:8080 easylean-backend
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X POST localhost:8080/verify && exit 0
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Check a proof and the #eval guard
        run: |
          proof='variable {P : Prop}\n\ntheorem t (h : P) : P := by\n  exact h\n'
          ok=$(curl -s -X POST localhost:8080/verify -H 'Content-Type: application/json' -d "{\"leanCode\": \"$proof\"}")
          echo "$ok"
          echo "$ok" | grep -q '"exitCode":0'
          evil=$(curl -s -X POST localhost:8080/verify -H 'Content-Type: application/json' -d '{"leanCode": "#eval 1"}')
          echo "$evil"
          echo "$evil" | grep -q 'Forbidden command'
