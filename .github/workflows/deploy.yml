# Deploys the site to GitHub Pages: main at the root, and the course's
# version (branch for-course) in the subfolder for-course/. Pages serves one
# site, so every run builds both branches, whichever of them was pushed.
# This file is the same on both branches.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "for-course"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout for-course
        uses: actions/checkout@v4
        with:
          ref: for-course
          path: for-course
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            main/frontend/package-lock.json
            for-course/frontend/package-lock.json
      - name: Build
        # The public backend, set as a repository variable; without it the
        # site expects a backend on localhost. Both versions use it.
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          (cd main/frontend && npm install && npm run build)
          (cd for-course/frontend && npm install && npm run build -- --base=/EasyLean/for-course/)
          cp -r for-course/frontend/dist main/frontend/dist/for-course
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'main/frontend/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
